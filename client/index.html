
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts Manager</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            padding: 30px 15px;
        }

        .container {
            max-width: 950px;
            margin: auto;
        }

        header {
            background: linear-gradient(135deg, #334155, #2563eb);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        header h1 {
            margin-bottom: 10px;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 {
            margin-bottom: 20px;
            color: #1e3a8a;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-top: 12px;
        }

        button:hover {
            opacity: 0.85;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: #e2e8f0;
            color: #334155;
        }

        .edit-btn {
            background: hsl(60, 1%, 63%);
            color: white;
            margin-right: 8px;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .post {
            border: 1px solid #e2e8f0;
            border-left: 4px solid #2563eb;
            padding: 18px;
            border-radius: 9px;
            margin-bottom: 15px;
            background: #fff;
        }

        .post h3 {
            margin-bottom: 8px;
        }

        .post p {
            color: #64748b;
            line-height: 1.5;
        }

        .post-id {
            color: #64748b;
            font-size: 12px;
            margin-bottom: 8px;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        .actions {
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>Posts Manager</h1>
        <p>Gestion des publications avec Node.js et API REST</p>
    </header>

    <!-- Formulaire d'ajout -->
    <section class="panel">

        <h2>Ajouter une publication</h2>

        <form id="postForm">

            <label for="title">Titre</label>
            <input type="text" id="title"
                   placeholder="Saisir le titre..." required>

            <label for="body">Contenu</label>
            <textarea id="body"
                      placeholder="Saisir le contenu..."
                      required></textarea>

            <button type="submit" class="primary">
                Ajouter le post
            </button>

        </form>

        <p id="message"></p>

    </section>

    <!-- Liste des posts -->
    <section class="panel">

        <h2>Liste des publications</h2>

        <button class="secondary" onclick="loadPosts()">
            Actualiser la liste
        </button>

        <div id="postsList" style="margin-top:20px">
            Chargement...
        </div>

    </section>

</div>

<script>

    const API_URL = 'http://localhost:3000/api/posts';

    const postsList = document.getElementById('postsList');
    const message = document.getElementById('message');
    const postForm = document.getElementById('postForm');

    // Afficher un message
    function showMessage(text, type) {
        message.textContent = text;
        message.className = type;
    }

    // Récupérer et afficher tous les posts
    async function loadPosts() {

        postsList.textContent = 'Chargement...';

        try {

            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error('Erreur HTTP : ' + response.status);
            }

            const posts = await response.json();

            postsList.innerHTML = '';

            if (posts.length === 0) {
                postsList.textContent = 'Aucune publication disponible.';
                return;
            }

            posts.forEach(post => {

                const article = document.createElement('article');
                article.className = 'post';

                const id = document.createElement('div');
                id.className = 'post-id';
                id.textContent = 'Publication #' + post.id;

                const title = document.createElement('h3');
                title.textContent = post.title;

                const body = document.createElement('p');
                body.textContent = post.body;

                // Bouton Modifier
                const editButton = document.createElement('button');
                editButton.className = 'edit-btn';
                editButton.textContent = 'Modifier';

                editButton.addEventListener('click', () => {
                    editPost(post);
                });

                // Bouton Supprimer
                const deleteButton = document.createElement('button');
                deleteButton.className = 'delete-btn';
                deleteButton.textContent = 'Supprimer';

                deleteButton.addEventListener('click', () => {
                    deletePost(post.id);
                });

                const actions = document.createElement('div');
                actions.className = 'actions';

                actions.append(editButton, deleteButton);

                article.append(id, title, body, actions);

                postsList.appendChild(article);

            });

        } catch (error) {

            postsList.textContent = 'Impossible de charger les publications.';
            console.error(error);

        }
    }

    // Ajouter un post avec POST
    postForm.addEventListener('submit', async function(event) {

        event.preventDefault();

        const newPost = {
            title: document.getElementById('title').value,
            body: document.getElementById('body').value,
            userId: 1
        };

        try {

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(newPost)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || 'Erreur lors de l’ajout');
            }

            showMessage('Publication ajoutée avec succès !', 'success');

            postForm.reset();
            loadPosts();

        } catch (error) {

            showMessage('Échec de l’ajout : ' + error.message, 'error');
            console.error(error);

        }

    });

    // Modifier un post avec PUT
    async function editPost(post) {

        const newTitle = prompt('Nouveau titre :', post.title);

        if (newTitle === null) return;

        const newBody = prompt('Nouveau contenu :', post.body);

        if (newBody === null) return;

        if (!newTitle.trim() || !newBody.trim()) {
            showMessage('Le titre et le contenu sont obligatoires.', 'error');
            return;
        }

        const updatedPost = {
            title: newTitle.trim(),
            body: newBody.trim()
        };

        try {

            const response = await fetch(`${API_URL}/${post.id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(updatedPost)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || 'Erreur lors de la modification');
            }

            showMessage('Publication modifiée avec succès !', 'success');

            loadPosts();

        } catch (error) {

            showMessage('Échec de la modification : ' + error.message, 'error');
            console.error(error);

        }
    }

    // Supprimer un post avec DELETE
    async function deletePost(id) {

        const confirmation = confirm(
            'Voulez-vous vraiment supprimer cette publication ?'
        );

        if (!confirmation) return;

        try {

            const response = await fetch(`${API_URL}/${id}`, {
                method: 'DELETE'
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || 'Erreur lors de la suppression');
            }

            showMessage('Publication supprimée avec succès !', 'success');

            loadPosts();

        } catch (error) {

            showMessage('Échec de la suppression : ' + error.message, 'error');
            console.error(error);

        }
    }

    // Chargement initial
    loadPosts();

</script>

</body>
</html>
